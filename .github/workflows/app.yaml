name: Python Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lints_pipeline:
    name: Lints CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.15']
    env:
      ENV: CI

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Install dependencies
      run: |
        make install PYTHON=python

    - name: Lint Code (use uppercase TODO, XXX, FIXME, NOTE and explain nopep8)
      run: |
        make lint-comment

    - name: Lint Code (use empty main inits)
      run: |
        make lint-emptyinit

    - name: Lint Code (sort requirements)
      run: |
        make lint-requirements

    - name: Lint Code (requirements complete)
      run: |
        make requirements-complete

    - name: Lint Code (use f"" style formating)
      run: |
        make lint-stringformat

    - name: Lint Code (indent in fours)
      run: |
        make lint-indent

    - name: Lint Code (no f"a", "{a}", or f'{a}')
      run: |
        make lint-forgottenformat PYTHON=python

    - name: Lint Code (missing trailing comma)
      run: |
        make lint-flake8

    - name: Lint Code (pycodestyle)
      run: |
        make lint-pycodestyle

    - name: Lint Code (type-check)
      run: |
        make lint-type-check

    - name: Lint Code (pylint)
      run: |
        make lint-pylint


  tests_pipeline:
    name: Tests CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.15']
        redis: ['8']
        ci_node_total: [3]
        ci_node_index: [0, 1, 2]
        include:
          # additionally run the full suite against the previous Redis major
          # in a single (unsharded) job; its timings and coverage are not
          # merged by the coverage pipeline
          - python: '3.12'
            redis: '7'
            ci_node_total: 1
            ci_node_index: 0
    env:
      ENV: CI
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    # restore only: the merged timings are saved by the coverage pipeline
    - name: Restore test-result Cache
      uses: actions/cache/restore@v6
      with:
        path: test-results/*
        key:  test-results-v1-${{ matrix.python }}-${{ hashFiles('test/*.py') }}-${{ hashFiles('test/data/*') }}
        restore-keys: |
          test-results-v1-${{ matrix.python }}-

    - name: Install dependencies
      run: |
        make install PYTHON=python

    - name: Run test on Node ${{ matrix.ci_node_index }} (Redis ${{ matrix.redis }})
      run: |
        PYTHON_NAME="${{ matrix.python }}" CUR_NODE_IX="${{ matrix.ci_node_index }}" TOTAL_NODES="${{ matrix.ci_node_total }}" make split-test

    - name: Upload Artifact(results)
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ matrix.python }}-redis${{ matrix.redis }}-${{ matrix.ci_node_index }}
        path: test-results/results-${{ matrix.python }}-${{ matrix.ci_node_index }}.xml
        if-no-files-found: error

    - name: Upload Artifact(coverage reports)
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.python }}-redis${{ matrix.redis }}-${{ matrix.ci_node_index }}
        path: .coverage
        include-hidden-files: true
        if-no-files-found: error

    - name: Git Check (tests may not alter any git visible files)
      run: |
        git status -sb --porcelain
        [ -z "$(git status --porcelain)" ]


  coverage_pipeline:
    name: Coverage CI Pipeline
    needs: tests_pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.15']
    env:
      ENV: CI

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Install dependencies
      run: |
        make install PYTHON=python

    - name: Restore test-result Cache
      uses: actions/cache@v6
      with:
        path: test-results/*
        key:  test-results-v1-${{ matrix.python }}-${{ hashFiles('test/*.py') }}-${{ hashFiles('test/data/*') }}

    - name: Clean test-result Cache
      run: |
        rm -r test-results/ || true
        mkdir -p test-results/parts/

    - name: Download results
      uses: actions/download-artifact@v8
      with:
        pattern: results-${{ matrix.python }}-redis8-*
        path: test-results/parts/
        merge-multiple: true

    - name: Download coverage reports
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-${{ matrix.python }}-redis8-*
        path: coverage-parts/

    - name: Merge results
      run: |
        ls -la test-results/parts/
        python -m test merge --dir test-results --out-fname results.xml
        tail -v -n +1 test-results/*.xml

    - name: Merge coverage reports
      run: |
        ls -la coverage-parts/*/
        coverage combine coverage-parts/*/.coverage
        coverage xml -o coverage/reports/xml_report.xml
        coverage html -d coverage/reports/html_report
        coverage report
